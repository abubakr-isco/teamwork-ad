<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Planner</title>
    <meta name="description" content="Интуитивный планировщик задач со статистикой выполнения и аналитикой." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/planner.css" />
  </head>
  <body>
    <div class="container">
      <!-- App Header -->
      <header class="app-header">
        <a href="index.html" class="header-brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="brand-title">Task Planner</span>
        </a>

        <nav class="header-nav">
          <a href="index.html" class="nav-link active">Планировщик</a>
          <a href="stats.html" class="nav-link">Статистика</a>
        </nav>

        <div class="header-actions">
          <button type="button" class="btn-random">
            <img src="/public/icon/random.svg" width="16" height="16" alt="" class="icon-random" />
            <span>Случайная задача</span>
          </button>
        </div>
      </header>

      <!-- Main Planner Content -->
      <main class="planner-container">
        <!-- Progress Card -->
        <section class="progress-card">
          <div id="progress-text" class="progress-header">Выполнено 55% (140 из 254)</div>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill" style="width: 55%"></div>
          </div>
        </section>

        <!-- Controls Card (Filters & Search) -->
        <section class="controls-card">
          <div class="filter-group">
            <button type="button" id="filter-all" class="filter-btn active" data-filter="all">
              <img src="/public/icon/users.svg" width="16" height="16" alt="" class="icon-filter-users" />
              <span>Все (254)</span>
            </button>
            <button type="button" id="filter-active" class="filter-btn" data-filter="active">Активные (114)</button>
            <button type="button" id="filter-completed" class="filter-btn" data-filter="completed">Выполненные (140)</button>
          </div>

          <div class="search-box">
            <span class="search-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск задач..." />
            <button type="button" id="search-clear" class="search-clear" aria-label="Очистить поиск">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </section>

        <!-- Tasks List Card -->
        <section class="tasks-card">
          <ul id="tasks-list" class="tasks-list">
            <!-- Dynamically populated by js/planner.js -->
          </ul>
          <div id="tasks-footer" class="tasks-footer">Показано 254 из 254</div>
        </section>
      </main>
    </div>

    <!-- Random Task Modal -->
    <div id="random-modal-overlay" class="modal-overlay" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-task-title">
        <div class="modal-header">
          <span class="modal-eyebrow">СЛУЧАЙНАЯ ЗАДАЧА</span>
          <button type="button" id="modal-close-btn" class="modal-close" aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <h3 id="modal-task-title" class="modal-title">Обновить дизайн главной страницы</h3>

        <div class="modal-meta">
          <span id="modal-task-status" class="badge-status badge-active">Активна</span>
          <span id="modal-task-user" class="user-name-text">User 48</span>
        </div>

        <div class="modal-actions">
          <button type="button" id="modal-cancel-btn" class="btn-secondary">Закрыть</button>
          <button type="button" id="modal-roll-again-btn" class="btn-secondary">
            <img src="/public/icon/random.svg" width="14" height="14" alt="" class="icon-random" />
            <span>Другая задача</span>
          </button>
          <button type="button" id="modal-toggle-status-btn" class="btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Изменить статус</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/planner.js"></script>
  </body>
</html>
